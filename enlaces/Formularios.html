<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>

    <form>
        <label for="nombre">Nombre :</label>
        <input type="text" id="nombre" required> <br><br>

        <label for="email">Email :</label>
        <input type="email" id="email" required> <br><br>

        <label for="edad">Edad :</label>
        <input type="number" id="edad" min="0" max="120"> <br><br>

        <label for="genero">Género :</label>
        <select id="genero" name="genero" required> <br><br>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select><br><br>
        <label for="email2">Email</label>
        <input type="email" id="email2" name="email2" placeholder="Introduce tu email"> <br><br>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Introduce tu teléfono"> <br><br>
        <label for="web">Página web</label>
        <input type="url" id="web" name="web" placeholder="https://ejemplo.com"> <br><br>
        <label for="cantidad">Cantidad (1-10)</label>
        <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1"> <br><br>
        <label for="rango">Rango (0-100)</label>
        <input type="range" id="rango" name="rango" min="0" max="100" step="10"> <br><br>
        

        
        <input type="reset" value="Restablecer">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
