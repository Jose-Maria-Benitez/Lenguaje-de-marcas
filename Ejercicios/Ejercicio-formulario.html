<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio formulario</title>
</head>
<body>
    <h1>Registro de usuario</h1>
    <form>

        
        <label for="Nombre">Nombre completo :</label>
        <input type="text" autofocus id="Nombre" autocomplete="Nombre" placeholder="introduzca su nombre completo" required> <br><br>

        <label for="email">Correo electrónico</label>
        <input type="email" autocomplete="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="ejemplo@gmail.com" required><br><br>

        <label for="contraseña">Contraseña :</label>
        <input type="password" id="contraseña" name="contraseña" pattern="^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':\\\|,.<>\/?]{8,}$" required> <br><br>

        <label for="confirmar contraseña">Confirmar contraseña :</label>
        <input type="password2" id="confirmar contraseña" name="confirmar contraseña" pattern="^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':\\\|,.<>\/?]{8,}$" required> <br><br>

        <label for="número de teléfono">Número de teléfono</label>
        <input type="tel" autocomplete="número de teléfono" name="número de teléfono" placeholder="600 000 000" pattern="^[0-9]{9}$" required> <br><br>

        <label for="fecha de nacimiento">Fecha de nacimiento :</label>
        <input type="date" id="fecha de nacimiento" name="fecha de nacimiento" required> <br><br>

        <label for="pais">País de nacimiento</label>
        <select id="pais" name="pais" required>
            <option value="" disabled selected>Seleccione su país</option>
            <option value="españa">España</option>
            <option value="francia">Francia</option>
            <option value="alemania">Alemania</option>
            <option value="italia">Italia</option>
            <option value="portugal">Portugal</option>
        </select><br><br>

        <label for="genero">Género :</label>
        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label>
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label>
        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Otro</label><br><br>
        </input><br><br>
        
        <label for="color favorito">Color favorito</label>
        <input type="color" id="color favorito" name="color favorito" value="#0000ff" size="30"> <br><br>

        <label for="Identificador solicitud">Su número de registro dentro de nuestra página:</label>
        <input type="number" id="identificador solicitud" name="identificador solicitud" placeholder="000338566" readonly> <br><br>

        <label for="rango">Del 1 al 10, indique el grado de satisfacción con la prueba gratuita:</label><br>
        <input type="range" id="rango" name="rango" min="1" max="10" step="1"><br><br>

        <label for="imagen de perfil">Suba aquí su foto de perfil</label><br>
        <input type="file" id="imagen de perfil" name="imagen de perfil" accept="image/*" size="50"> <br><br>

        <label for="términos">Para continuar con su suscripción, por favor, acepte nuestros términos y condiciones de usuario</label><br>
        <input type="checkbox" id="términos" name="términos" required> Acepto los términos y condiciones de usuario <br><br>

        <input type="reset" value="Restablecer">
        <input type="submit" value="Enviar">


    </form>
</body>
</html>
